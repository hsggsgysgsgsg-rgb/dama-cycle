name: Dama Online Cycle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node cycle.js
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DATABASE_URL: "ضع-رابط-قاعدة-بياناتك-هنا"
